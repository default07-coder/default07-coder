
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: default07-coder
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff3030&color_dots=#161b22,#5b1717,#a91e1e,#e52b2b,#ff4545
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff3030

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
